<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <meta name="description" content="Daily progress tracker showing days of the year">
    <meta name="theme-color" content="#000000">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/icon-72x72.png">
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="currentDate" class="date">Thursday, 15 January</div>
            <div id="currentTime" class="time">10:10</div>
        </div>

        <div class="content">
            <div class="progress-info">
                <div class="day-count">
                    <span id="currentDay" class="day-number">25</span>
                    <span class="day-text">of 365 days</span>
                </div>
                <div id="percentage" class="percentage">50% completed</div>
            </div>

            <div class="dots-container" id="dotsContainer"></div>

            <div class="legend">
                <div class="legend-item">
                    <div class="dot-sample completed"></div>
                    <span>Completed</span>
                </div>
                <div class="legend-item">
                    <div class="dot-sample current"></div>
                    <span>Today</span>
                </div>
                <div class="legend-item">
                    <div class="dot-sample upcoming"></div>
                    <span>Upcoming</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p class="update-note">Automatically updates daily</p>
            <p class="footer-note">Track your year</p>
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .catch(err => console.log('Service worker not registered:', err));
        }
    </script>
</body>
</html>
